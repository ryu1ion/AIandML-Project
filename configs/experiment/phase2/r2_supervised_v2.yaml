# R2 (v2 FINAL) — Supervised from scratch on ImageNet-100.
# v1 (eff lr 0.2) and the first v2 (eff lr 0.1) both stuck at CE~4.3 (random).
# Root cause: MobileNetV2 is LR-sensitive; linear batch-scaling pushed SGD too
# high. Isolation (eff lr 0.05) showed healthy learning. Fixes:
#   - lr_scale_rule: none, lr 0.05  (eff 0.05 regardless of #GPUs)
#   - label smoothing 0.1, 80 epochs, warmup 5
#   - eval uses BN recalibration (DDP+bf16 corrupts BN running stats)
task: supervised
dataset: imagenet100
data_root: data
image_size: 224
epochs: 80
batch_size: 256
optimizer: sgd
lr: 0.05
lr_scale_rule: none
weight_decay: 0.0001
schedule: cosine
warmup_epochs: 5
label_smoothing: 0.1
sync_bn: true
num_workers: 16
seed: 42
bf16: true
num_classes: 100
out_dir: checkpoints/phase2/r2_supervised_v2
log_every: 50
wandb: true
wandb_project: label-free-distill-phase2
wandb_mode: offline
wandb_run_name: r2_supervised_v2_in100
