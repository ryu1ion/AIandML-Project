# R3 (v2 FINAL) — SimSiam from scratch (no teacher) on ImageNet-100.
# v1 used SGD eff lr 0.1 (0.05 x linear 512/256) -> recalibrated LP only
# 10.2% (barely above random 4.4%). Same LR-too-high bug as R2 (MobileNetV2
# is LR-sensitive). Fix: lr_scale_rule none, lr 0.05 (eff 0.05). The SimSiam
# predictor keeps a fixed base lr (0.05, no cosine) per Chen & He 2021 §4.4
# (handled by the trainer for task=simsiam). Aggressive two-view aug kept
# (standard for SimSiam). Eval uses BN recalibration.
task: simsiam
dataset: imagenet100
data_root: data
image_size: 224
epochs: 80
batch_size: 256
optimizer: sgd
lr: 0.05
lr_scale_rule: none
weight_decay: 0.0001
schedule: cosine
warmup_epochs: 0
sync_bn: true
two_view_aug: in100
num_workers: 16
seed: 42
bf16: true
num_classes: 100
out_dir: checkpoints/phase2/r3_simsiam_v2
log_every: 50
wandb: true
wandb_project: label-free-distill-phase2
wandb_mode: offline
wandb_run_name: r3_simsiam_v2_in100
