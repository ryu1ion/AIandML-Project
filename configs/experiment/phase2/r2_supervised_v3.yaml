# R2 (v3) — continue supervised training from R2-v2 final.pt.
# v2 stopped at CE 4.28 / recalib LP 12.98 — under-converged (MobileNetV2
# from scratch typically needs ~300 epochs). Continue with a fresh cosine
# schedule (lr 0.02, lower than v2's 0.05 since features already learned),
# single-GPU on GPU 0 (no DDP -> no SyncBN -> no BN-eval bug to recalib for).
task: supervised
dataset: imagenet100
data_root: data
image_size: 224
resume_from: checkpoints/phase2/r2_supervised_v2/final.pt
epochs: 150
batch_size: 256
optimizer: sgd
lr: 0.02
lr_scale_rule: none
weight_decay: 0.0001
schedule: cosine
warmup_epochs: 2
label_smoothing: 0.1
sync_bn: false
num_workers: 28
seed: 42
bf16: true
num_classes: 100
out_dir: checkpoints/phase2/r2_supervised_v3
log_every: 100
wandb: true
wandb_project: label-free-distill-phase2
wandb_mode: offline
wandb_run_name: r2_supervised_v3_in100_resume
