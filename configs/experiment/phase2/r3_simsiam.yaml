# R3 — SSL from scratch (SimSiam, no teacher) on ImageNet-100.
# PHASE2 §4: SGD, lr 0.05 x global_batch/256, cosine, wd 1e-4. Epochs 50
# (not 100): agreed compute deviation for the 2-GPU / 40 GPU-h budget.
# global_batch 512 -> eff lr 0.1 for backbone+projector. The SimSiam
# predictor uses a FIXED base lr (0.05, no batch-scaling, no cosine) per
# Chen & He 2021 §4.4 (handled automatically by the trainer for task=simsiam).
task: simsiam
dataset: imagenet100
data_root: data
image_size: 224
epochs: 50
batch_size: 256
optimizer: sgd
lr: 0.05
lr_scale_rule: linear
weight_decay: 0.0001
schedule: cosine
warmup_epochs: 0
sync_bn: true
num_workers: 16
seed: 42
bf16: true
num_classes: 100
out_dir: checkpoints/phase2/r3_simsiam
log_every: 50
wandb: true
wandb_project: label-free-distill-phase2
wandb_mode: offline
wandb_run_name: r3_simsiam_in100
