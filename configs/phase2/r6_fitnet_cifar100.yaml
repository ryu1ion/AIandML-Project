# R6 FitNet on CIFAR-100 (NEW_BENCH Step 5).
task: fitnet
student: mobilenetv2
student_pretrained: false
dataset: cifar100
data_root: data
image_size: 224
epochs: 50
batch_size: 256
num_workers: 8
optimizer: sgd
lr: 0.1
weight_decay: 5.0e-4
schedule: cosine
warmup_epochs: 5
label_smoothing: 0.0
lr_scale_rule: none
sync_bn: false
bf16: true
seed: 42
num_classes: 100
out_dir: checkpoints/phase2/r6_fitnet_cifar100
teacher_checkpoint: checkpoints/phase2/r_teacher_r50_cifar100/final.pt
fitnet_beta: 1.0
wandb: true
wandb_mode: offline
wandb_project: label-free-distill-phase2
wandb_run_name: r6_fitnet_cifar100
