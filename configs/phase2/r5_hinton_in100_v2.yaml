# R5 Hinton KD on ImageNet-100 - retry with the same recipe that worked for R6.
task: hinton_kd
student: mobilenetv2
student_pretrained: false
dataset: imagenet100
data_root: data
image_size: 224
epochs: 15
batch_size: 192
num_workers: 8
optimizer: sgd
lr: 0.05
weight_decay: 1.0e-4
schedule: cosine
warmup_epochs: 2
label_smoothing: 0.0
lr_scale_rule: none
sync_bn: false
bf16: true
seed: 42
num_classes: 100
two_view_aug: in100
out_dir: checkpoints/phase2/r5_hinton_in100_v2
teacher_checkpoint: checkpoints/phase2/r_teacher_r50_in100/final.pt
kd_temperature: 4.0
kd_alpha: 0.9
wandb: true
wandb_mode: offline
wandb_project: label-free-distill-phase2
wandb_run_name: r5_hinton_in100_v2
